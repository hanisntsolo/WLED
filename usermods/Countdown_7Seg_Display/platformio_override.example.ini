; Example platformio_override.ini for Countdown 7-Segment Display Usermod
; Copy this file to the WLED root directory as platformio_override.ini
; and adjust as needed for your build environment.

[platformio]
default_envs = esp8266_countdown

; ESP8266 with Countdown 7-Segment Display
[env:esp8266_countdown]
extends = env:nodemcuv2
build_flags = ${env:nodemcuv2.build_flags}
  -D USERMOD_COUNTDOWN_7SEG
  ; Optional: Also enable Wake-on-LAN
  ; -D USERMOD_WAKE_ON_LAN
custom_usermods = Countdown_7Seg_Display

; ESP32 variant (if you prefer ESP32)
[env:esp32_countdown]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags}
  -D USERMOD_COUNTDOWN_7SEG
  ; Optional: Also enable Wake-on-LAN
  ; -D USERMOD_WAKE_ON_LAN
custom_usermods = Countdown_7Seg_Display

; Combined: Countdown display + Wake-on-LAN
[env:esp8266_countdown_wol]
extends = env:nodemcuv2
build_flags = ${env:nodemcuv2.build_flags}
  -D USERMOD_COUNTDOWN_7SEG
  -D USERMOD_WAKE_ON_LAN
custom_usermods = Countdown_7Seg_Display Wake_on_LAN
